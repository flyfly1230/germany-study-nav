</style></head><body><div class="shell"><aside class="side"><a class="brand" href="#top" aria-label="赴德指南首页"><span class="mark">赴</span><div><strong>赴德指南</strong><small>CHUYI’S STUDY HUB</small></div></a><div class="side-label">我的留学导航</div><nav class="nav" aria-label="资源分类"><a class="active" href="#apply"><span>01</span> 留学申请</a><a href="#schools"><span>02</span> 选校与专业</a><a href="#language"><span>03</span> 语言学习</a><a href="#alevel"><span>04</span> A-Level 备考</a><a href="#reading"><span>05</span> 阅读资源</a></nav><div class="side-bottom"><b>一步一步，走向德国。</b>把每一份准备，放在这里。<div class="flag" aria-hidden="true"><i></i><i></i><i></i></div></div></aside><main id="top"><div class="topline"><b>CHUYI / 德国留学</b><span class="pill">个人资源收藏夹</span></div><header class="intro"><div><div class="eyebrow">MEIN WEG NACH DEUTSCHLAND</div><h1>你的下一站，<span>德国。</span></h1><p>从选校申请到日常学习，常用入口都在这里。</p></div><div class="index-stamp"><strong>12</strong><small>收藏资源 · 5 个分类</small></div></header><div id="sections"></div><footer class="footer"><strong>赴德指南 · 为 Chuyi 的留学之路而整理</strong><span>申请要求以院校及考试机构最新公布的信息为准。</span></footer></main></div><script>
const groups=[
{id:'apply',title:'留学申请',en:'APPLICATION',items:[['DAAD 德国学术交流中心','德国留学与科研信息总入口，查找留学指南和奖学金相关信息。','https://www.daad.de/de/','DA','官方入口','',true],['anabin 入学资格查询','查询不同国家学历对应的德国大学入学资格，具体认定需进入网站核实。','https://anabin.kmk.org/db/schulabschluesse-mit-hochschulzugang#land_gewaehlt','an','资格查询','待核实'],['uni-assist','部分德国高校使用的国际学生申请与材料预审平台。是否使用以院校要求为准。','https://www.uni-assist.de/','u:a','申请平台','待核实']]},
{id:'schools',title:'选校与专业',en:'UNIVERSITY',items:[['萨尔大学 · 计算机本科 B.Sc.','学校官方专业页：标准学制 6 学期。基础计算机课程多用英语，部分课程及辅修涉及德语，需兼顾两种语言。','https://www.uni-saarland.de/studium/angebot/bachelor/informatik.html','UdS','院校官网',''],['萨尔大学 · Informatik','DAAD 计算机专业介绍页。学位、授课语言和申请条件待核实。','https://www.daad.de/de/in-deutschland-studieren/hochschulen/alle-studiengaenge/detail/universitaet-des-saarlandes-informatik-g2311/?hec-institution=235&hec-p=5&hec-id=g2311&hec-offset=87','UdS','计算机','待核实']]},
{id:'language',title:'语言学习',en:'LANGUAGES',items:[['awesome-IELTS','听说读写练习与模拟考试的个人资源合集，包含 Academic 与 General Training。','https://github.com/shah0150/awesome-IELTS','IEL','雅思备考',''],['Urban Dictionary','查询英语俚语与网络表达。用户贡献词条，适合理解非正式语境。','https://www.urbandictionary.com/','ud','英语词典',''],['Chuyi Deutsch','个人德语学习入口。根据网址暂定分类，具体内容待确认。','https://chuyi-deutsch-60.flyfly1230.chatgpt.site/','DE','德语学习','待核实']]},
{id:'alevel',title:'A-Level 备考',en:'STUDY & EXAMS',items:[['Physics & Maths Tutor','数学、物理等学科的学习与备考入口，具体资源范围待核实。','https://www.physicsandmathstutor.com/','PMT','学科复习','待核实'],['British Council 学校考试','学校考试的国家与地区选择入口，可报名的考试类别需进入网站确认。','https://schoolexams.britishcouncil.org/select-country','BC','考试报名','待核实'],['A-Level Wordbook','个人词汇学习入口。根据网址暂归为 A-Level 词汇工具，功能待确认。','https://alevel-wordbook-chuyi.flyfly1230.chatgpt.site/','Aa','词汇学习','待核实']]},
{id:'reading',title:'阅读资源',en:'READING',items:[['Z-Library','你收藏的阅读资源网址，域名归属及当前可用性尚未核实。','https://z-library.sk/','Z','电子书','待核实']]}
];
const host=document.querySelector('#sections');
groups.forEach((g,i)=>{const sec=document.createElement('section');sec.className='section';sec.id=g.id;const header=document.createElement('div');header.className='section-head';header.innerHTML=`<div class="section-title"><em>0${i+1}</em><h2>${g.title}</h2></div><span>${g.en} / ${String(g.items.length).padStart(2,'0')}</span>`;sec.append(header);const grid=document.createElement('div');grid.className='grid';g.items.forEach(([title,desc,url,icon,tag,status,featured])=>{const a=document.createElement('a');a.className='card'+(featured?' featured':'');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',`${title}（在新标签页打开）`);const domain=new URL(url).hostname.replace(/^www\./,'');a.innerHTML=`<div class="card-top"><span class="icon" aria-hidden="true">${icon}</span><span class="tag">${tag}</span></div><h3>${title}</h3><p>${desc}</p><div class="card-foot"><span class="domain">${domain}</span><span class="${status?'status':''}">${status||'打开网站'}</span></div>`;grid.append(a)});sec.append(grid);if(g.id==='reading'){const n=document.createElement('p');n.className='note';n.textContent='“待核实”表示整理时未能读取页面，不代表网站一定不可用。';sec.append(n)}host.append(sec)});
const links=[...document.querySelectorAll('.nav a')];const observer=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){links.forEach(a=>a.classList.toggle('active',a.hash==='#'+entry.target.id));}}},{rootMargin:'-10% 0px -65% 0px',threshold:0});document.querySelectorAll('.section').forEach(s=>observer.observe(s));
